<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* Prompt (SIL OFL 1.1) — thai + latin subsets; emoji from the system Noto Color Emoji */
@font-face{font-family:'PromptX';font-weight:500;src:url('fonts/prompt-thai-500-normal.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;}
@font-face{font-family:'PromptX';font-weight:500;src:url('fonts/prompt-latin-500-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-2199,U+201C-201D,U+203A;}
@font-face{font-family:'PromptX';font-weight:600;src:url('fonts/prompt-thai-600-normal.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;}
@font-face{font-family:'PromptX';font-weight:600;src:url('fonts/prompt-latin-600-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-2199,U+201C-201D,U+203A;}
@font-face{font-family:'PromptX';font-weight:700;src:url('fonts/prompt-thai-700-normal.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;}
@font-face{font-family:'PromptX';font-weight:700;src:url('fonts/prompt-latin-700-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-2199,U+201C-201D,U+203A;}
@font-face{font-family:'PromptX';font-weight:800;src:url('fonts/prompt-thai-800-normal.woff2') format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC;}
@font-face{font-family:'PromptX';font-weight:800;src:url('fonts/prompt-latin-800-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-2199,U+201C-201D,U+203A;}
html,body{margin:0;background:transparent;}
body{font-family:'PromptX','Noto Color Emoji',sans-serif;width:1080px;}
#stage{position:absolute;left:40px;top:40px;}
.kw{color:#FFD54A;font-weight:700;white-space:nowrap;}
.sub{display:inline-block;max-width:820px;padding:12px 28px 16px;border-radius:22px;background:rgba(10,12,20,.68);color:#fff;
     font-weight:600;font-size:50px;line-height:1.36;text-align:center;text-wrap:balance;box-shadow:0 6px 22px rgba(0,0,0,.35);}
.pill{display:inline-flex;align-items:center;gap:16px;padding:10px 30px 12px 12px;border-radius:999px;background:#1D4ED8;color:#fff;
      font-size:42px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);}
.pill .n{background:#fff;color:#1D4ED8;border-radius:999px;padding:2px 20px 6px;font-weight:800;font-size:38px;}
.pill .kw{color:#fff;font-weight:700;}
.tip{display:inline-block;max-width:900px;padding:12px 26px 16px;border-radius:18px;background:rgba(255,255,255,.96);color:#0F172A;
     font-size:38px;font-weight:600;line-height:1.32;text-align:center;text-wrap:balance;box-shadow:0 8px 24px rgba(0,0,0,.30);}
.tip .kw{color:#1D4ED8;}
.hook{display:inline-block;width:940px;padding:24px 30px 30px;border-radius:30px;background:rgba(8,10,18,.72);color:#fff;font-size:70px;
      font-weight:800;line-height:1.24;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.45);}
.big{display:inline-block;padding:6px 28px 14px;font-size:118px;font-weight:800;color:#fff;
     text-shadow:0 6px 26px rgba(0,0,0,.6),0 0 3px rgba(0,0,0,.8);}
.spill{display:inline-block;padding:12px 34px 16px;border-radius:999px;background:#1D4ED8;color:#fff;font-size:50px;font-weight:700;
       box-shadow:0 8px 24px rgba(0,0,0,.35);}
.spill .kw{color:#fff;}
.card{display:inline-block;width:880px;padding:40px 40px 48px;border-radius:34px;background:rgba(10,13,24,.90);color:#fff;text-align:center;
      box-shadow:0 14px 44px rgba(0,0,0,.5);}
.card .t1{display:inline-block;background:#1D4ED8;border-radius:999px;padding:4px 30px 10px;font-size:44px;font-weight:800;}
.card .t2{font-size:66px;font-weight:800;margin-top:20px;line-height:1.2;}
.card .t2 .kw{color:#fff;}
.card .d{font-size:44px;font-weight:600;margin-top:24px;line-height:1.45;color:#E5E7EB;}
.cta1{display:inline-block;max-width:960px;padding:18px 36px 26px;border-radius:30px;background:rgba(8,10,18,.82);color:#fff;font-size:86px;
      font-weight:800;line-height:1.18;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.45);}
.cta2{display:inline-block;padding:18px 40px 24px;border-radius:28px;background:#fff;color:#0F172A;font-size:62px;font-weight:700;line-height:1.3;
      text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.45);}
.cta2 .kw{color:#DC2626;font-weight:800;}
</style></head>
<body><div id="stage"></div>
<script>
window.renderItem = async (cls, html) => {
  const st = document.getElementById('stage');
  st.innerHTML = `<div class="${cls}" id="it">${html}</div>`;
  await document.fonts.ready;
  const r = document.getElementById('it').getBoundingClientRect();
  return { x: r.x, y: r.y, w: r.width, h: r.height };
};
</script></body></html>
