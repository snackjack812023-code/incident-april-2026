<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.scrim-t{position:absolute;left:0;top:0;width:1080px;height:760px;background:linear-gradient(180deg,rgba(4,10,38,.68) 0%,rgba(4,10,38,.38) 55%,rgba(4,10,38,0) 100%)}
.scrim-b{position:absolute;left:0;top:1180px;width:1080px;height:740px;background:linear-gradient(0deg,rgba(4,10,38,.66) 0%,rgba(4,10,38,.30) 60%,rgba(4,10,38,0) 100%)}
.glow1{position:absolute;left:-210px;top:160px;width:1500px;height:1500px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.40) 0%,rgba(37,99,235,.17) 36%,rgba(37,99,235,0) 68%)}
.glow2{position:absolute;left:520px;top:-330px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.17) 0%,rgba(34,211,238,0) 66%)}
.card{position:absolute;left:40px;top:560px;width:1000px;height:700px;border-radius:30px}
.paper{position:absolute;left:160px;top:546px;width:760px;height:817px;border-radius:14px}
.ashadow{box-shadow:0 44px 90px rgba(0,5,28,.62),0 10px 26px rgba(0,5,28,.50),0 0 0 1px rgba(0,0,0,.25)}
.aborder{box-shadow:inset 0 0 0 2px rgba(255,255,255,.20),inset 0 2px 0 rgba(255,255,255,.34),0 0 36px rgba(34,211,238,.16)}
.pshadow{box-shadow:0 40px 90px rgba(0,5,28,.60),0 12px 28px rgba(0,5,28,.45),0 0 0 1px rgba(0,0,0,.18)}
.pborder{box-shadow:inset 0 0 0 1px rgba(10,19,48,.10),0 0 0 1.5px rgba(255,255,255,.30),0 0 44px rgba(34,211,238,.20)}
body.mask-mode{background:#000}
</style></head><body><div id="cv"></div>
<script>
const m=new URLSearchParams(location.search).get('m'); const cv=document.getElementById('cv');
const L={bgfx:'<div class="glow1"></div><div class="glow2"></div><div class="scrim-t"></div><div class="scrim-b"></div>',
  ashadow:'<div class="card ashadow"></div>', aborder:'<div class="card aborder"></div>',
  pshadow:'<div class="paper pshadow"></div>', pborder:'<div class="paper pborder"></div>'};
if(L[m]) cv.innerHTML=L[m];
if(m==='amask'||m==='pmask'){document.body.classList.add('mask-mode');const [w,h,r]=m==='amask'?[1000,700,30]:[760,817,14];
  cv.style.cssText=`position:absolute;left:0;top:0;width:${w}px;height:${h}px;background:#000`;cv.innerHTML=`<div style="position:absolute;left:0;top:0;width:${w}px;height:${h}px;border-radius:${r}px;background:#fff"></div>`;}
</script></body></html>
