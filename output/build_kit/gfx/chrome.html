<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.scrim-t{position:absolute;left:0;top:0;width:1080px;height:760px;background:linear-gradient(180deg,rgba(4,10,38,.68) 0%,rgba(4,10,38,.38) 55%,rgba(4,10,38,0) 100%)}
.scrim-b{position:absolute;left:0;top:1180px;width:1080px;height:740px;background:linear-gradient(0deg,rgba(4,10,38,.66) 0%,rgba(4,10,38,.30) 60%,rgba(4,10,38,0) 100%)}
.glow1{position:absolute;left:-210px;top:160px;width:1500px;height:1500px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.40) 0%,rgba(37,99,235,.17) 36%,rgba(37,99,235,0) 68%)}
.glow2{position:absolute;left:520px;top:-330px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.17) 0%,rgba(34,211,238,0) 66%)}
.card{position:absolute;left:40px;top:560px;width:1000px;height:700px;border-radius:30px}
.shadow{box-shadow:0 44px 90px rgba(0,5,28,.62),0 10px 26px rgba(0,5,28,.50),0 0 0 1px rgba(0,0,0,.25)}
.border{box-shadow:inset 0 0 0 2px rgba(255,255,255,.20),inset 0 2px 0 rgba(255,255,255,.34),0 0 36px rgba(34,211,238,.16)}
.mask{background:#fff}
body.mask-mode{background:#000}
</style><script src="lib.js"></script></head><body>
<div id="cv"></div>
<script>
const mode=new URLSearchParams(location.search).get('m');
const cv=document.getElementById('cv');
if(mode==='shadow'){cv.innerHTML='<div class="glow1"></div><div class="glow2"></div><div class="scrim-t"></div><div class="scrim-b"></div><div class="card shadow"></div>';}
if(mode==='border'){cv.innerHTML='<div class="card border"></div>';}
if(mode==='urlmask'){document.body.classList.add('mask-mode');cv.style.cssText='position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;overflow:hidden';
  const pts=[[148,44],[992,44],[992,92],[148,92]].map(([u,v])=>KIT.toSrc(u,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  cv.innerHTML='<svg width="1920" height="1080" style="position:absolute;left:0;top:0"><polygon points="'+pts+'" fill="#fff" style="filter:blur(4px)"/></svg>';}
if(mode==='mask'){document.body.classList.add('mask-mode');cv.style.cssText='position:absolute;left:0;top:0;width:1000px;height:700px;background:#000';cv.innerHTML='<div class="mask" style="position:absolute;left:0;top:0;width:1000px;height:700px;border-radius:30px"></div>';}
</script></body></html>
