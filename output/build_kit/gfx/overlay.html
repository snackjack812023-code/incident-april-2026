<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
:root{--cyan:#22D3EE;--blue:#2563EB;--navy:#0A1330;--yellow:#FFD60A;--orange:#FF9F1C;}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
body{font-family:'PromptX','Noto Color Emoji',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}
.txt{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;line-height:1.16;text-shadow:0 5px 26px rgba(2,8,32,.60),0 1px 3px rgba(2,8,32,.45)}
.h1{font-weight:800}
.cy{color:var(--cyan)}
.yl{color:var(--yellow)}
.mark{position:relative;display:inline-block}
.mark::after{content:"";position:absolute;left:2%;right:2%;bottom:-2px;height:12px;border-radius:7px;background:var(--yellow);transform-origin:left center;transform:scaleX(var(--mk,0));opacity:.95;box-shadow:0 0 22px rgba(255,214,10,.45)}
/* step pills */
#steps{position:absolute;left:0;width:1080px;display:flex;justify-content:center;align-items:center;gap:14px}
.pill{display:flex;align-items:center;gap:14px;height:90px;padding:0 30px 0 14px;border-radius:45px;font-weight:600;font-size:44px;background:rgba(255,255,255,.08);border:2.5px solid rgba(255,255,255,.26);color:rgba(255,255,255,.62);white-space:nowrap}
.pill .n{width:60px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:38px;background:rgba(255,255,255,.18);color:rgba(255,255,255,.8)}
.pill.on{background:linear-gradient(90deg,rgba(37,99,235,.55),rgba(34,211,238,.38));border-color:var(--cyan);color:#fff;box-shadow:0 0 34px rgba(34,211,238,.35)}
.pill.on .n{background:var(--cyan);color:var(--navy)}
.arr{width:34px;height:34px;opacity:.5}
/* caption pill */
.cap{position:absolute;left:0;width:1080px;display:flex;justify-content:center}
.cap>div{display:flex;align-items:center;gap:18px;height:100px;padding:0 44px 0 28px;border-radius:50px;font-weight:700;font-size:54px;background:rgba(8,18,52,.62);border:2.5px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);white-space:nowrap;box-shadow:0 14px 40px rgba(0,5,30,.45)}
.ck{width:62px;height:62px;border-radius:31px;background:var(--cyan);display:flex;align-items:center;justify-content:center}
/* action pill (S3) */
.act{position:absolute;left:0;width:1080px;display:flex;justify-content:center}
.act>div{height:112px;display:flex;align-items:center;gap:22px;padding:0 54px;border-radius:56px;font-weight:800;font-size:62px;white-space:nowrap;background:linear-gradient(90deg,#2563EB,#06B6D4);box-shadow:0 0 0 3px rgba(255,255,255,.28),0 18px 50px rgba(6,182,212,.45)}
/* card fx container */
#cardfx{position:absolute;left:40px;top:560px;width:1000px;height:700px;border-radius:30px;overflow:hidden}
.ring{position:absolute;border:4.5px solid var(--yellow);border-radius:14px;box-shadow:0 0 0 7px rgba(255,214,10,.16),0 0 30px 4px rgba(255,214,10,.55);will-change:transform,opacity}
.ring.cy2{border-color:var(--cyan);box-shadow:0 0 0 7px rgba(34,211,238,.16),0 0 30px 4px rgba(34,211,238,.6)}
.ripple{position:absolute;border-radius:50%;border:6px solid var(--orange);background:rgba(255,159,28,.22);will-change:transform,opacity}
.flash{position:absolute;border-radius:14px;background:rgba(255,214,10,.22)}
</style></head><body><div id="cv">
 <!-- S1 -->
 <div id="s1" class="abs" style="left:0;top:0;width:1080px;height:560px">
  <div class="txt h1" id="s1a" data-size="128" style="top:196px">ทำใบเสนอราคา</div>
  <div class="txt h1 cy" id="s1b" data-size="108" style="top:352px">ยัง<span class="mark" id="mk">พิมพ์เอง</span>อยู่เหรอ? 😅</div>
 </div>
 <!-- S2 steps + caption -->
 <div id="s2" class="abs" style="left:0;top:0;width:1080px;height:1920px">
  <div id="steps" style="top:296px">
   <div class="pill" id="p0"><span class="n">1</span>ลูกค้า</div>
   <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
   <div class="pill" id="p1"><span class="n">2</span>สินค้า/บริการ</div>
   <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
   <div class="pill" id="p2"><span class="n">3</span>ราคา</div>
  </div>
  <div class="cap" id="cap2" style="top:1296px"><div><span class="ck"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0A1330" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>กรอกข้อมูลครั้งเดียว</div></div>
 </div>
 <!-- S3 -->
 <div id="s3" class="abs" style="left:0;top:0;width:1080px;height:1920px">
  <div class="act" id="act3" style="top:292px"><div><svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.7-2.3L4 14.5a1.5 1.5 0 0 1 2.3-1.9L9 15"/></svg>กดสร้างใบเสนอราคา</div></div>
 </div>
 <!-- S4 -->
 <div id="s4" class="abs" style="left:0;top:0;width:1080px;height:1920px">
  <div class="txt h1" id="s4a" data-size="156" style="top:190px">เสร็จแล้ว! 🔥</div>
  <div class="txt cy" id="s4b" data-size="68" style="top:420px;font-weight:700">ไม่ต้องจัดหน้าเอกสารเอง</div>
 </div>
 <!-- S5 -->
 <div id="s5" class="abs" style="left:0;top:0;width:1080px;height:1920px">
  <div class="txt h1" id="s5a" data-size="120" style="top:190px">Google Apps Script</div>
  <div class="txt h1 cy" id="s5b" data-size="124" style="top:340px">ทำได้แล้วรู้ยัง?</div>
  <div class="abs" id="s5c" style="left:0;top:1296px;width:1080px;text-align:center">
    <div id="s5line" style="width:150px;height:7px;border-radius:4px;margin:0 auto 20px;background:linear-gradient(90deg,#2563EB,#22D3EE)"></div>
    <div id="s5brand" data-size="76" style="font-weight:700;white-space:nowrap;letter-spacing:.5px;text-shadow:0 5px 26px rgba(2,8,32,.6)">SmartFlow <span class="cy">Systems</span></div>
  </div>
 </div>
</div>
<div id="cardfx"></div>
<script src="lib.js"></script>
<script>
const K=KIT, SHOTS=window.__SHOTS, EV=window.__EV; const cam=K.makeCam(SHOTS);
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={out3:p=>1-Math.pow(1-p,3),outBack:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},io:p=>.5-.5*Math.cos(Math.PI*p)};
const prog=(f,f0,len)=>clamp((f-f0)/len);
// fit text blocks to the safe width (960px)
function fit(){ document.querySelectorAll('[data-size]').forEach(el=>{let s=+el.dataset.size; el.style.fontSize=s+'px'; const maxW=el.dataset.max?+el.dataset.max:960;
  const w=()=>{const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width}; let g=0; while(w()>maxW&&g++<80){s-=2;el.style.fontSize=s+'px'} el.dataset.fit=s;});
  const st=$('steps'); let sc=1; const w=()=>{const kids=[...st.children];const a=kids[0].getBoundingClientRect().left,b=kids[kids.length-1].getBoundingClientRect().right;return b-a}; let g=0; let fs=44; while(w()>960&&g++<30){fs-=1;document.querySelectorAll('.pill').forEach(p=>p.style.fontSize=fs+'px')} st.dataset.fit=fs;
}
function setT(el,y,s=1,o=1){el.style.transform=`translateY(${y}px) scale(${s})`;el.style.opacity=o;}
// R coords -> cardfx px at frame f
function mapR(f,u,v){const r=cam(f);const s=1000/r.w;return[(u-r.u)*s,(v-r.v)*s,s]}
function rectR(f,x,y,w,h,pad=0){const [a,b,s]=mapR(f,x,y);return{l:a-pad,t:b-pad,w:w*s+2*pad,h:h*s+2*pad,s}}
let rings={};
function ring(key,f,x,y,w,h,{pad=10,cls='',on,off,pulse=true,flashAt=[]}={}){
  let el=rings[key]; if(!el){el=document.createElement('div');el.className='ring '+cls;$('cardfx').appendChild(el);rings[key]=el;}
  const vis=f>=on&&f<off; if(!vis){el.style.display='none';return}
  el.style.display='block'; const r=rectR(f,x,y,w,h,pad);
  const pin=E.out3(prog(f,on,7)), pout=1-prog(f,off-6,6);
  let sc=1.22-0.22*pin; let op=pin*Math.min(1,pout);
  if(pulse){ sc*=1+0.014*Math.sin((f-on)/30*2*Math.PI*1.7); }
  for(const fa of flashAt){const q=prog(f,fa,10); if(q>0&&q<1) sc*=1+0.06*Math.sin(q*Math.PI);} 
  el.style.left=r.l+'px';el.style.top=r.t+'px';el.style.width=r.w+'px';el.style.height=r.h+'px';
  el.style.borderRadius=Math.max(10,14*r.s*0.6)+'px';
  el.style.transform=`scale(${sc})`;el.style.opacity=op;
}
let ripples={};
function ripple(key,f,f0,cx,cy,{size=1,delay=0}={}){
  let el=ripples[key]; if(!el){el=document.createElement('div');el.className='ripple';$('cardfx').appendChild(el);ripples[key]=el;}
  const q=prog(f,f0+delay,16); if(q<=0||q>=1){el.style.display='none';return}
  const [x,y,s]=mapR(f,cx,cy); const R=(18+80*E.out3(q))*size; el.style.display='block';
  el.style.left=(x-R)+'px';el.style.top=(y-R)+'px';el.style.width=2*R+'px';el.style.height=2*R+'px';el.style.opacity=(1-q)*.95;el.style.borderWidth=(6*(1-q)+1.5)+'px';
}
function renderAt(f){
  const t=f/30;
  // scene visibility
  const sc={1:[0,60],2:[60,180],3:[180,270],4:[270,360],5:[360,449]};
  for(const k in sc){$('s'+k).style.display=(f>=sc[k][0]&&f<sc[k][1])?'block':'none'}
  $('cap2').style.display=(f>=60&&f<180)?'flex':'none';
  // ---- S1
  if(f<60){ const p=E.out3(prog(f,0,10)); setT($('s1a'),0,1,1); setT($('s1b'),0,1,1);
    $('mk').style.setProperty('--mk',E.out3(prog(f,8,16))); }
  // ---- S2
  if(f>=60&&f<180){
    const idx=f<93?0:(f<126?1:2); const f0=[60,93,126][idx];
    [0,1,2].forEach(i=>{const p=$('p'+i);p.classList.toggle('on',i===idx);
      let s=1; if(i===idx){const q=prog(f,f0,8); s=1+0.07*Math.sin(q*Math.PI);} p.style.transform=`scale(${s})`;});
    const q=E.out3(prog(f,60,8)); setT($('steps'),(1-q)*-14,1,0.45+0.55*q);
    const c=E.out3(prog(f,62,10)); setT($('cap2'),(1-c)*22,1,0.3+0.7*c);
  }
  // ---- S3
  if(f>=180&&f<270){ const q=E.outBack(prog(f,180,12)); const o=0.4+0.6*clamp(prog(f,180,6)); const pulse=1+0.04*Math.sin(prog(f,219,9)*Math.PI);
    setT($('act3'),(1-clamp(q))*18,(0.85+0.15*clamp(q,0,1.2))*pulse,o); $('act3').style.display='flex'; }
  // ---- S4
  if(f>=270&&f<360){ const p=E.outBack(prog(f,270,13)); const o=0.55+0.45*clamp(prog(f,270,4)); setT($('s4a'),0,0.6+0.4*p,o);
    const q=E.out3(prog(f,278,10)); setT($('s4b'),(1-q)*26,1,q); }
  // ---- S5
  if(f>=360){ const a=E.out3(prog(f,360,9)); setT($('s5a'),(1-a)*28,1,0.5+0.5*a); const b=E.out3(prog(f,362,9)); setT($('s5b'),(1-b)*28,1,0.5+0.5*b);
    const c=E.out3(prog(f,372,10)); setT($('s5c'),(1-c)*22,1,c); $('s5line').style.transform=`scaleX(${E.out3(prog(f,374,14))})`; }
  // ---- rings (card coords from R coords)
  const T=EV;
  ring('cust',f,T.cust[0],T.cust[1],T.cust[2],T.cust[3],{pad:8,on:64,off:93});
  ring('item',f,T.item[0],T.item[1],T.item[2],T.item[3],{pad:8,on:97,off:126});
  ring('price',f,T.price[0],T.price[1],T.price[2],T.price[3],{pad:7,on:130,off:177});
  ring('total',f,T.total[0],T.total[1],T.total[2],T.total[3],{pad:7,on:136,off:177,flashAt:T.keyFrames});
  ring('pdf',f,T.pdf[0],T.pdf[1],T.pdf[2],T.pdf[3],{pad:8,cls:'cy2',on:T.holdF,off:T.clickF+14});
  ring('bubble',f,T.bubble[0],T.bubble[1],T.bubble[2],T.bubble[3],{pad:8,cls:'cy2',on:T.bubbleF,off:T.bubbleF+16});
  ripple('c1',f,T.click1F,T.btn1[0],T.btn1[1],{size:0.7});
  ripple('c2',f,T.clickF,T.pdfC[0],T.pdfC[1],{size:1});
  ripple('c2b',f,T.clickF,T.pdfC[0],T.pdfC[1],{size:1.35,delay:4});
}
window.renderAt=renderAt;
(async()=>{
  const ws=['500','600','700','800'];
  await Promise.all(ws.flatMap(w=>[document.fonts.load(w+' 40px PromptX','กขคงจ'),document.fonts.load(w+' 40px PromptX','AaGg?!')]));
  await document.fonts.ready;
  fit(); window.ready=true;
})();
</script></body></html>
